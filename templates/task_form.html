{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/task_form.css') }}">
{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="card task-card mx-auto shadow-lg">
    <div class="card-header text-center bg-secondary text-white">
      <h3 class="mb-0">{{ 'Editar Tarea' if action=='edit' else 'Nueva Tarea' }}</h3>
    </div>
    <div class="card-body ">
      <form method="POST">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="title" class="form-label text-primary-emphasis">Título</label>
            <input type="text" id="title" name="title" class="form-control" required
                   value="{{ task.title if action=='edit' else '' }}">
          </div>
          <div class="col-md-6">
            <label for="priority" class="form-label  text-primary-emphasis">Prioridad</label>
            <select id="priority" name="priority" class="form-select">
              <option value="Alta" {% if action=='edit' and task.priority=='Alta' %}selected{% endif %}>Alta</option>
              <option value="Media" {% if action=='edit' and task.priority=='Media' %}selected{% endif %}>Media</option>
              <option value="Baja" {% if action=='edit' and task.priority=='Baja' %}selected{% endif %}>Baja</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="due_date" class="form-label  text-primary-emphasis">Fecha de vencimiento</label>
            <input type="date" id="due_date" name="due_date" class="form-control" required
                   value="{{ task.due_date.strftime('%Y-%m-%d') if action=='edit' and task.due_date }}">
          </div>
          <div class="col-md-6">
            <label for="status" class="form-label  text-primary-emphasis">Estado</label>
            <select id="status" name="status" class="form-select">
              <option value="Pendiente" {% if action=='edit' and task.status=='Pendiente' %}selected{% endif %}>Pendiente</option>
              <option value="En progreso" {% if action=='edit' and task.status=='En progreso' %}selected{% endif %}>En progreso</option>
              <option value="Completada" {% if action=='edit' and task.status=='Completada' %}selected{% endif %}>Completada</option>
            </select>
          </div>
          <div class="col-12">
            <label for="description" class="form-label  text-primary-emphasis">Descripción</label>
            <textarea id="description" name="description" rows="4" class="form-control">{{ task.description if action=='edit' else '' }}</textarea>
          </div>
        </div>

        <div class="d-flex justify-content-between mt-4">
          <a href="{{ url_for('main.home') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Cancelar
          </a>
          <button type="submit" class="btn btn-secondary">
            <i class="fas fa-save me-1"></i>Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
