{% extends "base.html" %}

{% block title %}Restablecer Contraseña – Taskly{% endblock %}

{% block extra_css %}
<!-- Reutiliza tu CSS existente -->
<link href="{{ url_for('static', filename='css/extracted/common.css') }}" rel="stylesheet" />
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="card mx-auto shadow-sm" style="max-width: 420px; border-radius: 0.75rem;">
    <div class="card-header bg-primary text-white text-center">
      <h4 class="mb-0">Restablecer Contraseña</h4>
    </div>
    <div class="card-body p-4">
      <p class="text-muted mb-4">Introduce tu nueva contraseña para continuar.</p>
      <form method="POST">
        <div class="mb-3">
          <label for="password" class="form-label">Nueva Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="mb-3">
          <label for="confirm_password" class="form-label">Confirmar Contraseña</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="fas fa-save me-2"></i>Guardar Contraseña
        </button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Volver al inicio de sesión</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
